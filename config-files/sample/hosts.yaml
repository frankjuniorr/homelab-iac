all:

  #####################################################################
  # Global variables
  #####################################################################
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ssh_public_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_rsa_homelab.pub"
    ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_rsa_homelab"

    network_gateway: ""

  hosts:
    #####################################################################
    # Proxmox Nodes
    #####################################################################
    proxmox:
      ansible_host: ""
      ansible_user: "root"
      root_password: ""
      proxmox_target_node: ""
      ansible_python_interpreter: /usr/bin/python3

      # VM Template with cloud init image, config
      cloud_init_template:
        vm_id: ""
        vm_template_name: ""
        vm_storage: "local-lvm"
        vm_username: ""
        vm_user_password: ""

      # Cloud init image config
      config_cloud_image_directory: "/root/config-cloud-image"
      ubuntu_cloud_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
      ubuntu_cloud_image_file: "/var/lib/vz/images/ubuntu24.qcow2"
      ubuntu_cloud_image_root_password: "Ubuntu"

    #####################################################################
    # VMs
    #####################################################################

    ############# VM: Docker host (netuno) - AdGuard, Tailscale, Duplicati via docker-compose
    # ansible_user must NOT be "docker" (it would clash with the docker group)
    docker:
      ansible_host: ""            # e.g. 192.168.1.51 (the IP the LAN will use as DNS)
      ansible_user: ""
      root_password: ""           # must be equal to vm_user_passwd (used by ssh_copy_key)
      vm_user: ""
      vm_user_passwd: ""

      proxmox_vm_id:
      proxmox_cpu: 2
      proxmox_vm_name: "netuno"
      proxmox_memory: 4096
      proxmox_vm_disk_size: "40G"
      proxmox_vm_tags: "docker,compose"

    ############# VM: Home Assistant OS (terra) - boots from the official HAOS image, no cloud-init
    haos:
      ansible_host: ""            # HAOS uses DHCP: reserve this IP in the router
      ansible_user: "root"

      proxmox_vm_id:
      proxmox_cpu: 2
      proxmox_vm_name: "terra"
      proxmox_memory: 4096
      proxmox_vm_disk_size: "32G"
      proxmox_vm_tags: "homeassistant,haos"


#####################################################################
#  Hosts Groups
#####################################################################
  children:

    # Proxmox Nodes
    proxmox_nodes:
      hosts:
        proxmox:

    # Docker host (netuno)
    docker_hosts:
      hosts:
        docker:

    # Home Assistant OS VM (terra)
    haos_hosts:
      hosts:
        haos:

    # Ubuntu VMs (cloned from the cloud-init template)
    ubuntu_vms:
      children:
        docker_hosts:

    # All VMs
    vms_all:
      children:
        ubuntu_vms:
        haos_hosts:
