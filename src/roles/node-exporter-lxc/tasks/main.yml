---
- name: "Check currently installed node_exporter version"
  ansible.builtin.shell:
    cmd: "/usr/local/bin/node_exporter --version 2>&1 | awk '/node_exporter, version/{print $3}'"
  register: ne_installed
  changed_when: false
  failed_when: false

- name: "Set installed version fact"
  ansible.builtin.set_fact:
    ne_current: "{{ ne_installed.stdout | trim }}"

- name: "Download node_exporter {{ node_exporter_version }}"
  ansible.builtin.get_url:
    url: "{{ node_exporter_binary_url }}"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"
  when: ne_current != node_exporter_version

- name: "Extract node_exporter archive"
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp/
    remote_src: true
  when: ne_current != node_exporter_version

- name: "Install node_exporter binary"
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: ne_current != node_exporter_version
  notify: "Reload systemd and restart node_exporter"

- name: "Remove node_exporter temp files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
  when: ne_current != node_exporter_version

- name: "Create node_exporter system user"
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: "Install node_exporter systemd unit"
  ansible.builtin.copy:
    src: node_exporter.service
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: "Reload systemd and restart node_exporter"

- name: "Enable and start node_exporter"
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: false
