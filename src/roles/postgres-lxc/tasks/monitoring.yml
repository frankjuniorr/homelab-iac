---
- name: "Check currently installed postgres_exporter version"
  ansible.builtin.shell:
    cmd: "/usr/local/bin/postgres_exporter --version 2>&1 | awk '/postgres_exporter, version/{print $3}'"
  register: pge_installed
  changed_when: false
  failed_when: false

- name: "Set installed postgres_exporter version fact"
  ansible.builtin.set_fact:
    pge_current: "{{ pge_installed.stdout | trim }}"

- name: "Download postgres_exporter {{ postgres_exporter_version }}"
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    mode: "0644"
  when: pge_current != postgres_exporter_version

- name: "Extract postgres_exporter archive"
  ansible.builtin.unarchive:
    src: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    dest: /tmp/
    remote_src: true
  when: pge_current != postgres_exporter_version

- name: "Install postgres_exporter binary"
  ansible.builtin.copy:
    src: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"
    dest: /usr/local/bin/postgres_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: pge_current != postgres_exporter_version
  notify: "Restart postgres_exporter"

- name: "Remove postgres_exporter temp files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    - "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64"
  when: pge_current != postgres_exporter_version

- name: "Deploy postgres_exporter environment file"
  ansible.builtin.copy:
    dest: /etc/postgres_exporter.env
    owner: root
    group: postgres
    mode: "0640"
    content: |
      DATA_SOURCE_NAME=postgresql:///postgres?host=/var/run/postgresql&user=postgres&sslmode=disable

- name: "Install postgres_exporter systemd unit"
  ansible.builtin.copy:
    src: postgres_exporter.service
    dest: /etc/systemd/system/postgres_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: "Restart postgres_exporter"

- name: "Enable and start postgres_exporter"
  ansible.builtin.systemd:
    name: postgres_exporter
    enabled: true
    state: started
    daemon_reload: true
