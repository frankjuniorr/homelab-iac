---
##############################################
# Proxmox Init Configure
##############################################
- name: "Proxmox init-configure"
  hosts: proxmox_nodes
  gather_facts: false
  become: true

  roles:
    # Provision VMs (Customize Image, Template and Clone)
    - role: create-proxmox-vms
      tags:
        - proxmox-init
        - vms

##############################################
# Weekly vzdump of the VMs (netuno, terra)
##############################################
- name: "Schedule weekly vzdump of the VMs"
  hosts: proxmox_nodes
  become: true
  gather_facts: false

  roles:
    - role: proxmox-backup-jobs
      tags:
        - deploy-infra
        - vms
        - vzdump

##############################################
# Running in all hosts
##############################################
- name: "Creating the user and configuring ssh"
  hosts: all:!haos_hosts
  become: true
  gather_facts: false

  roles:
    - role: configure-remote-ssh
      tags:
        - deploy-infra
        - vms


##############################################
# Base Guest OS Configuration
##############################################
- name: "Configure Guest OS"
  hosts: ubuntu_vms
  become: true
  gather_facts: false

  roles:
    - role: configure-guest-os
      tags:
        - deploy-infra
        - vms

    - role: dns-client
      tags:
        - deploy-infra
        - vms

##############################################
# Docker host (netuno): Docker Engine + Compose, port 53 free, IP forwarding
# The stacks themselves (AdGuard, Tailscale, Duplicati) are deployed by homelab-deploys
##############################################
- name: "Configuring the Docker host"
  hosts: docker_hosts
  become: true
  gather_facts: true

  roles:
    - role: docker-host
      tags:
        - deploy-infra
        - vms
        - docker

##############################################
# Post-Deploy Cleanup
##############################################
- name: "Post-deploy cleanup: delete cloud-init template VM"
  hosts: proxmox_nodes
  become: true
  gather_facts: false

  tasks:
    - name: "Check if cloud-init template VM {{ cloud_init_template.vm_id }} exists"
      ansible.builtin.command: "qm status {{ cloud_init_template.vm_id }}"
      register: template_check
      failed_when: false
      changed_when: false
      tags: ["post-deploy"]

    - name: "Delete cloud-init template VM {{ cloud_init_template.vm_id }}"
      ansible.builtin.shell: |
        qm stop {{ cloud_init_template.vm_id }} || true
        qm destroy {{ cloud_init_template.vm_id }} --purge
      when: template_check.rc == 0
      tags: ["post-deploy"]

